name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --target wasm32-wasip2 --release --locked
      - name: Verify official-SDK fixtures are reproducible
        run: |
          cargo run --locked --example generate_sdk_fixtures
          git diff --exit-code -- fixtures/sdk
      - name: Reject obvious committed secrets
        run: |
          ! git grep -Ein '(bot[0-9]{6,}:[A-Za-z0-9_-]{20,}|(api[_-]?key|token)[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,})'
