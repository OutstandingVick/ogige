[package]
name = "solana-guard"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: Solana transaction safety gate — decode, narrate, and ALLOW/HOLD/REJECT."
publish = false

# cdylib for the wasm component; rlib so the pure guard core is testable
# on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
bincode = "1.3"
proptest = "1.11"
solana-hash = "=4.6.0"
solana-message = "=4.5.0"
solana-signature = "=3.5.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-transaction = { version = "=4.2.0", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
